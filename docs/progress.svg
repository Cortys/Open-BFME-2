<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2: 31.60% rebuilt from source, 25.16% of the game's own code in C++</title>
  <desc id="desc">2,521,278 of 7,978,500 code bytes rebuild to the original's exact bytes; 1,890,831 of the game's own 7,516,088 bytes are C++.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; } .track { fill: #21262d; }
    .strong { fill: #f0f6fc; } .muted { fill: #8b949e; } .up { fill: #3fb950; } .down { fill: #f85149; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; } .track { fill: #eaeef2; }
      .strong { fill: #1f2328; } .muted { fill: #59636e; } .up { fill: #1a7f37; } .down { fill: #cf222e; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="879" height="291" rx="12"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
    <text x="28" y="30" class="muted" font-size="13" font-weight="600" letter-spacing="1.3">BFME 2 · REBUILD PROGRESS</text>
    <text x="28" y="64" class="strong" font-size="15" font-weight="600">Rebuilt from source</text>
    <text x="852" y="64" class="strong" font-size="20" font-weight="700" text-anchor="end">31.60%</text>
    <rect class="track" x="28" y="74" width="824" height="14" rx="7"/>
    <rect x="28" y="74" width="260.39" height="14" rx="7" fill="#2ea043"/>
    <text x="28" y="108" class="muted" font-size="12.5">2,521,278 / 7,978,500 bytes rebuilt without copying the original game.dat (v1.06)</text>
    <text x="28" y="138" class="strong" font-size="15" font-weight="600">Game code in C++</text>
    <text x="852" y="138" class="strong" font-size="20" font-weight="700" text-anchor="end">25.16%</text>
    <rect class="track" x="28" y="148" width="824" height="14" rx="7"/>
    <rect x="28" y="148" width="207.29" height="14" rx="7" fill="#388bfd"/>
    <text x="28" y="182" class="muted" font-size="12.5">1,890,831 / 7,516,088 bytes of the game's own code, now C++ (libraries not counted)</text>
    <text x="28" y="212" class="strong" font-size="15" font-weight="600">Linking</text>
    <text x="852" y="212" class="strong" font-size="20" font-weight="700" text-anchor="end">5.36%</text>
    <rect class="track" x="28" y="222" width="824" height="14" rx="7"/>
    <rect x="28" y="222" width="44.18" height="14" rx="7" fill="#d29922"/>
    <text x="28" y="256" class="muted" font-size="12.5">402,941 / 7,516,088 bytes of the game's own code linked (measured 2026-09-29)</text>
  </g>
</svg>
