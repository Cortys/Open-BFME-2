<svg xmlns="http://www.w3.org/2000/svg" width="880" height="252" viewBox="0 0 880 252" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2 rebuilt from source: 30.20%</title>
  <desc id="desc">2,409,281 of 7,978,500 code bytes rebuilt without copying the original; 1,777,766 of 7,515,217 bytes of the game's own code are C++. Ledger-derived; not a fresh build verification.</desc>
