<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2: 36.59% rebuilt from source, 30.42% game code in C++, 10.59% linking</title>
  <desc id="desc">2,919,382 of 7,978,500 code bytes rebuild to the original's exact bytes; 2,285,837 of the game's own 7,513,857 bytes are C++.</desc>
  <style>
